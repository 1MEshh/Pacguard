<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>

    <!-- Arch Blue Gradient -->
    <linearGradient id="arch-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1793D1"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0077FE"/>
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1793D1" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0B557A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#05283B" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16253B" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>

    <!-- Filter Glow -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="440" fill="url(#bg-grad)"/>

  <!-- Forensic Grid -->
  <rect width="1200" height="440" fill="url(#grid)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#arch-glow)"/>

  <!-- Shield & Arch Icon Emblem -->
  <g transform="translate(85, 75)" filter="url(#glow-filter)">
    <!-- Outer Shield Frame -->
    <path d="M110 20 L200 60 L200 170 C200 240 110 290 110 290 C110 290 20 240 20 170 L20 60 Z"
          fill="url(#shield-grad)" stroke="#1793D1" stroke-width="3" stroke-linejoin="round"/>
    <!-- Inner Core Shield -->
    <path d="M110 45 L180 78 L180 165 C180 220 110 262 110 262 C110 262 40 220 40 165 L40 78 Z"
          fill="none" stroke="#00F0FF" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Arch Triangle Silhouette -->
    <path d="M110 80 L145 175 L125 175 L118 155 L102 155 L95 175 L75 175 Z"
          fill="#1793D1" stroke="#00F0FF" stroke-width="1.5"/>
    <polygon points="110,105 115,138 105,138" fill="#080C14"/>
    <!-- Radar Reticle Rings -->
    <circle cx="110" cy="155" r="38" fill="none" stroke="#10B981" stroke-width="1.8" stroke-dasharray="4,4"/>
    <circle cx="110" cy="155" r="8" fill="#00F0FF" fill-opacity="0.5"/>
  </g>

  <!-- Title & Branding -->
  <text x="350" y="145" font-family="'JetBrains Mono', 'Fira Code', 'Ubuntu Mono', 'Courier New', monospace"
        font-size="62" font-weight="900" fill="#FFFFFF" letter-spacing="4">PACGUARD</text>

  <!-- Accent Line Under Title -->
  <rect x="352" y="162" width="680" height="3" fill="url(#arch-glow)"/>

  <!-- Subtitle -->
  <text x="352" y="198" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif"
        font-size="18" font-weight="600" fill="#00F0FF" letter-spacing="1.5">ARCH LINUX AUR SUPPLY-CHAIN &amp; SYSTEMD SECURITY AUDITOR</text>

  <!-- Description Body -->
  <text x="352" y="232" font-family="'JetBrains Mono', 'Segoe UI', system-ui, sans-serif"
        font-size="13.5" font-weight="400" fill="#8B949E">
    Static AST heuristics, version-diff hijack detection, SKIP bypass auditor &amp; weighted systemd exposure scorer
  </text>

  <!-- Feature Badges -->
  <g transform="translate(352, 268)">
    <!-- Badge 1: Python 3.10+ STD-LIB -->
    <rect x="0" y="0" width="145" height="30" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
    <text x="72" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#58A6FF" text-anchor="middle">PYTHON 3.10+ STD</text>

    <!-- Badge 2: AUR SUPPLY-CHAIN -->
    <rect x="155" y="0" width="150" height="30" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
    <text x="230" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#F85149" text-anchor="middle">AUR SUPPLY-CHAIN</text>

    <!-- Badge 3: SYSTEMD SCORER -->
    <rect x="315" y="0" width="140" height="30" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
    <text x="385" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#F0883E" text-anchor="middle">SYSTEMD AUDITOR</text>

    <!-- Badge 4: SARIF v2.1.0 -->
    <rect x="465" y="0" width="135" height="30" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
    <text x="532" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#3FB950" text-anchor="middle">SARIF v2.1.0</text>

    <!-- Badge 5: ZERO LEAK -->
    <rect x="610" y="0" width="120" height="30" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
    <text x="670" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#D2A8FF" text-anchor="middle">ZERO LEAK</text>
  </g>

  <!-- Technical Command Snippet Line -->
  <g transform="translate(352, 342)">
    <rect x="0" y="0" width="760" height="42" rx="6" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
    <text x="20" y="26" font-family="monospace" font-size="12" fill="#7EE787">$</text>
    <text x="36" y="26" font-family="monospace" font-size="12" fill="#C9D1D9">pacguard diff-pkgbuild PKGBUILD.v1 PKGBUILD.v2 --fail-on critical</text>
    <text x="590" y="26" font-family="monospace" font-size="12" fill="#8B949E">[ Delta S_v1 \ S_v2 ]</text>
  </g>
</svg>
